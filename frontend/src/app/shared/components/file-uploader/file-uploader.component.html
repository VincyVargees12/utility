<div class="max-w-4xl mx-auto px-4 pb-12">
  <div class="flex justify-center">
    <div class="w-full max-w-2xl">
      <div 
        class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-12 text-center hover:border-purple-500 dark:hover:border-purple-400 transition-colors cursor-pointer bg-white dark:bg-gray-800"
        (drop)="onFileDrop($event)"
        (dragover)="onDragOver($event)"
        (click)="fileInput.click()">
        
        <button class="btn btn-primary text-lg px-8 py-3 mb-4" type="button">
          {{ buttonText() }}
        </button>
        
        <p class="text-sm text-tertiary">{{ subtitleText() }}</p>
        
        <input 
          #fileInput
          type="file" 
          [accept]="accept()"
          [multiple]="multiple()"
          class="hidden"
          (change)="onFileInput($event)">
      </div>

      @if (errorMessage()) {
        <div class="mt-4 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 dark:bg-red-950 dark:border-red-800 dark:text-red-300">
          {{ errorMessage() }}
        </div>
      }
    </div>
  </div>
</div>
