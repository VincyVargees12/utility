<main class="w-full">
  <div class="max-w-none mx-auto px-4 py-8 ml-[10%]">
    <div class="flex flex-col lg:flex-row gap-6 items-start relative">
      <div class="flex-1 w-full min-w-0">
        <div class="mb-8">
          <h1 class="text-4xl font-bold text-primary mb-3">SQL Formatter</h1>
          <p class="text-lg text-secondary dark:text-white">Beautify and standardize your SQL queries for better readability across various database dialects.</p>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-2 gap-5">
          <div class="bg-white rounded-lg border-2 border-gray-200 overflow-hidden shadow-sm">
            <div class="border-b border-gray-200 px-6 py-4 bg-gray-50 flex items-center justify-between">
              <h2 class="text-lg font-bold text-primary">Input SQL</h2>
              <div class="flex items-center gap-2">
                <button
                  (click)="loadSample()"
                  class="px-3 py-1 bg-purple-100 text-purple-700 rounded-md hover:bg-purple-200 transition-colors text-xs font-medium"
                >
                  Sample
                </button>
                <button
                  (click)="clearAll()"
                  class="px-3 py-1 bg-red-100 text-red-700 rounded-md hover:bg-red-200 transition-colors text-xs font-medium"
                >
                  Clear
                </button>
                <button
                  (click)="copyInput()"
                  [disabled]="!inputText().trim()"
                  class="text-lg leading-none text-gray-600 hover:text-blue-600 transition-colors disabled:text-gray-600 disabled:cursor-not-allowed"
                  title="Copy input SQL"
                  aria-label="Copy input SQL"
                >
                  <mat-icon class="text-lg align-middle">content_copy</mat-icon>
                </button>
              </div>
            </div>
            <div class="p-6">
              <div
                #inputEditorHost
                class="monaco-host h-[32rem] border border-gray-300 rounded-lg overflow-hidden"
                aria-label="Input SQL editor"
              ></div>
            </div>
            <div class="border-t border-gray-200 px-6 py-4 bg-gray-50 flex items-center gap-3">
              <label class="flex-1">
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-3 cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition-colors text-center">
                  <p class="text-xs font-medium text-primary">📁 Upload .sql</p>
                  <input type="file" accept=".sql,.txt" (change)="onFileSelected($event)" class="hidden">
                </div>
              </label>
            </div>
          </div>

          <div class="bg-white rounded-lg border-2 border-gray-200 overflow-hidden shadow-sm">
            <div class="border-b border-gray-200 px-6 py-4 bg-gray-50 flex items-center justify-between">
              <h2 class="text-lg font-bold text-primary">Formatted SQL</h2>
              <div class="flex items-center gap-2">
                @if (isValid() !== null) {
                  <span
                    class="text-xs font-semibold px-3 py-1 rounded-full"
                    [ngClass]="isValid() ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
                  >
                    {{ isValid() ? 'Success' : 'Syntax Error' }}
                  </span>
                }
                <button
                  (click)="copyOutput()"
                  [disabled]="!outputText().trim()"
                  class="text-lg leading-none text-gray-600 hover:text-blue-600 transition-colors disabled:text-gray-600 disabled:cursor-not-allowed"
                  title="Copy formatted SQL"
                  aria-label="Copy formatted SQL"
                >
                  <mat-icon class="text-lg align-middle">content_copy</mat-icon>
                </button>
              </div>
            </div>
            <div class="p-6">
              <div
                #outputEditorHost
                class="monaco-host h-[32rem] border border-gray-300 rounded-lg overflow-hidden"
                aria-label="Output SQL editor"
              ></div>
              @if (errorMessage()) {
                <p
                  class="mt-3 text-sm font-mono p-3 rounded"
                  [ngClass]="isValid() ? 'text-green-600 bg-green-50' : 'text-red-600 bg-red-50'"
                >
                  {{ errorMessage() }}
                </p>
              }
            </div>
          </div>
        </div>
      </div>

      <!-- Action Sidebar -->
      <div class="hidden lg:flex sticky top-[70px] w-[380px] flex-shrink-0 bg-white border-l border-gray-200 shadow-xl flex-col">
        <h3 class="text-xl font-bold text-primary border-b p-6 text-center">Actions</h3>

        <div class="px-4 pb-6 space-y-4 mt-4">
          <div class="space-y-2">
            <label for="sqlDialect" class="block text-sm font-semibold text-primary">SQL Dialect</label>
            <select
              id="sqlDialect"
              [value]="dialect()"
              (change)="dialect.set($any($event.target).value)"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
            >
              @for (d of dialects; track d.value) {
                <option [value]="d.value">{{ d.label }}</option>
              }
            </select>
          </div>

          <div class="space-y-2">
            <label for="sqlIndentSize" class="block text-sm font-semibold text-primary">Indentation</label>
            <select
              id="sqlIndentSize"
              [value]="indentSize()"
              (change)="indentSize.set(+$any($event.target).value)"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
            >
              <option value="2">2 spaces</option>
              <option value="4">4 spaces</option>
              <option value="8">8 spaces</option>
            </select>
          </div>

          <div class="space-y-2 pt-2 border-t border-gray-200">
            <div class="flex items-center gap-2">
              <input
                type="checkbox"
                id="uppercaseKeywords"
                [checked]="uppercase()"
                (change)="uppercase.set(!uppercase())"
                class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 cursor-pointer"
              >
              <label for="uppercaseKeywords" class="text-sm text-gray-700 cursor-pointer">Uppercase Keywords (SELECT, FROM, etc.)</label>
            </div>
          </div>

          <div class="pt-2 border-t border-gray-200 space-y-2">
            <button
              (click)="formatSql()"
              [disabled]="!inputText().trim()"
              class="w-full px-6 py-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-semibold text-sm disabled:bg-gray-300 disabled:cursor-not-allowed shadow-md flex items-center justify-center gap-2"
            >
              <span>Format SQL</span>
            </button>
          </div>

          <div class="pt-2 border-t border-gray-200 space-y-2">
            <button
              (click)="copyOutput()"
              [disabled]="!outputText().trim()"
              class="w-full px-6 py-3 text-white rounded-lg transition-colors font-semibold text-sm disabled:bg-gray-300 disabled:cursor-not-allowed shadow-sm"
              [ngClass]="copied() ? 'bg-green-600 hover:bg-green-700' : 'bg-violet-600 hover:bg-violet-700'"
            >
              {{ copied() ? 'Copied to Clipboard' : 'Copy Formatted SQL' }}
            </button>

            <button
              (click)="downloadOutput()"
              [disabled]="!outputText().trim()"
              class="w-full px-6 py-3 bg-purple-100 text-black rounded-lg hover:bg-purple-200 transition-colors font-semibold text-sm disabled:bg-gray-300 disabled:cursor-not-allowed shadow-sm"
            >
              Download .sql File
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Related Tools Section -->
<app-related-tools [currentRoute]="'/categories/developer/sql-formatter'" [maxTools]="6"></app-related-tools>

<!-- Full resource content: What is SQL, features, how-to, errors, examples, FAQ -->
<app-tool-resource-content [data]="resourceContent"></app-tool-resource-content>
