<main class="w-full">
  <div class="max-w-none mx-auto px-4 py-8">
    <div class="flex flex-col lg:flex-row gap-6 items-start relative">
      <div class="flex-1 w-full pr-0 lg:pr-[380px]">
        <div class="mb-8">
          <h1 class="text-4xl font-bold text-primary mb-3">JSON Formatter</h1>
          <p class="text-lg ">Beautify, validate, sort, and minify JSON quickly for cleaner development workflows.</p>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-2 gap-5">
          <div class="bg-white rounded-lg border-2 border-gray-200 overflow-hidden shadow-sm">
            <div class="border-b border-gray-200 px-6 py-4 bg-gray-50 flex items-center justify-between">
              <h2 class="text-lg font-bold text-primary">Input JSON</h2>
              <div class="flex items-center gap-2">
                <button
                  (click)="loadSample()"
                  class="px-3 py-1 bg-indigo-100 text-indigo-700 rounded-md hover:bg-indigo-200 transition-colors text-xs font-medium"
                >
                  Sample
                </button>
                <button
                  (click)="clearAll()"
                  class="px-3 py-1 bg-red-100 text-red-700 rounded-md hover:bg-red-200 transition-colors text-xs font-medium"
                >
                  Clear
                </button>
                <button
                  (click)="copyInput()"
                  [disabled]="!inputText().trim()"
                  class="text-lg leading-none text-gray-500 hover:text-blue-600 transition-colors disabled:text-gray-300 disabled:cursor-not-allowed"
                  title="Copy input JSON"
                  aria-label="Copy input JSON"
                >
                  📋
                </button>
              </div>
            </div>
            <div class="p-6">
              <div
                #inputEditorHost
                class="monaco-host h-[32rem] border border-gray-300 rounded-lg overflow-hidden"
                aria-label="Input JSON editor"
              ></div>
            </div>
            <div class="border-t border-gray-200 px-6 py-4 bg-gray-50 flex items-center gap-3">
              <label class="flex-1">
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-3 cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition-colors text-center">
                  <p class="text-xs font-medium text-primary">📁 Upload .json</p>
                  <input type="file" accept=".json,.txt" (change)="onFileSelected($event)" class="hidden">
                </div>
              </label>
            </div>
          </div>

          <div class="bg-white rounded-lg border-2 border-gray-200 overflow-hidden shadow-sm">
            <div class="border-b border-gray-200 px-6 py-4 bg-gray-50 flex items-center justify-between">
              <h2 class="text-lg font-bold text-primary">Output JSON</h2>
              <div class="flex items-center gap-2">
                @if (isValid() !== null) {
                  <span
                    class="text-xs font-semibold px-3 py-1 rounded-full"
                    [ngClass]="isValid() ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
                  >
                    {{ isValid() ? 'Valid' : 'Invalid' }}
                  </span>
                }
                <button
                  (click)="copyOutput()"
                  [disabled]="!outputText().trim()"
                  class="text-lg leading-none text-gray-500 hover:text-blue-600 transition-colors disabled:text-gray-300 disabled:cursor-not-allowed"
                  title="Copy output JSON"
                  aria-label="Copy output JSON"
                >
                  📋
                </button>
              </div>
            </div>
            <div class="p-6">
              <div
                #outputEditorHost
                class="monaco-host h-[32rem] border border-gray-300 rounded-lg overflow-hidden"
                aria-label="Output JSON editor"
              ></div>
              @if (errorMessage()) {
                <p
                  class="mt-3 text-sm"
                  [ngClass]="isValid() ? 'text-green-600' : 'text-red-600'"
                >
                  {{ errorMessage() }}
                </p>
              }
            </div>
          </div>
        </div>
      </div>

      <div class="hidden lg:flex fixed right-0 top-[70px] w-[380px] h-[calc(100vh-70px)] bg-white border-l border-gray-200 shadow-xl flex-col overflow-y-auto z-50">
        <h3 class="text-xl font-bold text-primary border-b p-6 text-center">Actions</h3>

        <div class="px-4 pb-6 space-y-4 mt-4">
          <div class="space-y-2">
            <label for="jsonIndentSize" class="block text-sm font-semibold text-primary">Indentation</label>
            <select
              id="jsonIndentSize"
              [value]="indentSize()"
              (change)="indentSize.set(+$any($event.target).value)"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
            >
              <option value="2">2 spaces</option>
              <option value="4">4 spaces</option>
              <option value="8">8 spaces</option>
            </select>
          </div>

          <div class="space-y-2 pt-2 border-t border-gray-200">
            <div class="flex items-center gap-2">
              <input
                id="sortKeys"
                type="checkbox"
                [checked]="sortKeys()"
                (change)="sortKeys.set(!sortKeys())"
                class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 cursor-pointer"
              >
              <label for="sortKeys" class="text-sm text-gray-700 cursor-pointer">Sort object keys</label>
            </div>
          </div>

          <div class="pt-2 border-t border-gray-200 space-y-2">
            <button
              (click)="formatJson()"
              [disabled]="!inputText().trim()"
              class="w-full px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-semibold text-sm disabled:bg-gray-300 disabled:cursor-not-allowed"
            >
              Format JSON
            </button>

            <button
              (click)="minifyJson()"
              [disabled]="!inputText().trim()"
              class="w-full px-6 py-3 bg-teal-600 text-white rounded-lg hover:bg-teal-700 transition-colors font-semibold text-sm disabled:bg-gray-300 disabled:cursor-not-allowed"
            >
              Minify JSON
            </button>

            <button
              (click)="validateJson()"
              [disabled]="!inputText().trim()"
              class="w-full px-6 py-3 bg-amber-500 text-white rounded-lg hover:bg-amber-600 transition-colors font-semibold text-sm disabled:bg-gray-300 disabled:cursor-not-allowed"
            >
              Validate JSON
            </button>
          </div>

          <div class="pt-2 border-t border-gray-200 space-y-2">
            <button
              (click)="copyOutput()"
              [disabled]="!outputText().trim()"
              class="w-full px-6 py-3 text-white rounded-lg transition-colors font-semibold text-sm disabled:bg-gray-300 disabled:cursor-not-allowed"
              [ngClass]="copied() ? 'bg-green-600 hover:bg-green-700' : 'bg-violet-600 hover:bg-violet-700'"
            >
              {{ copied() ? 'Copied' : 'Copy Output' }}
            </button>

            <button
              (click)="downloadOutput()"
              [disabled]="!outputText().trim()"
              class="w-full px-6 py-3 bg-slate-700 text-white rounded-lg hover:bg-slate-800 transition-colors font-semibold text-sm disabled:bg-gray-300 disabled:cursor-not-allowed"
            >
              Download JSON
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Related Tools Section -->
<app-related-tools [currentRoute]="'/categories/developer/json-formatter'" [maxTools]="6"></app-related-tools>
