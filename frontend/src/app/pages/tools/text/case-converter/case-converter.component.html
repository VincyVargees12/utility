<main class="w-full">
  <div class="max-w-none mx-auto px-4 py-8 ml-[10%]">
    <div class="flex flex-col lg:flex-row gap-6 items-start relative">
      <!-- Main Content Area -->
      <div class="flex-1 w-full min-w-0">
        <!-- Title and Subtitle -->
        <div class="mb-8">
          <h1 class="text-4xl font-bold text-primary mb-3">Case Converter & Text Formatter</h1>
          <p class="text-lg text-secondary dark:text-white">Convert your text to uppercase, lowercase, title case, camelCase, snake_case, kebab-case, and more formats instantly.</p>
        </div>

        <!-- Text Input Area -->
        <div class="bg-white rounded-lg border-2 border-gray-200 overflow-hidden shadow-sm">
          <!-- Input Header -->
          <div class="border-b border-gray-200 px-6 py-4 bg-gray-50">
            <h2 class="text-lg font-bold text-primary">Paste or Upload Text</h2>
          </div>

          <!-- Textarea -->
          <div class="p-6">
            <textarea
              [value]="text()"
              (input)="text.set($event.target.value); onTextChange()"
              placeholder="Start typing or paste your content here... You can also upload a file below."
              class="w-full h-96 p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none font-mono text-sm"
            ></textarea>
          </div>

          <!-- File Upload Area -->
          <div class="border-t border-gray-200 px-6 py-6 bg-gray-50">
            <div class="flex items-center gap-4">
              <label class="flex-1">
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition-colors text-center">
                  <p class="text-sm font-medium text-primary mb-1">📁 Upload File</p>
                  <p class="text-xs text-secondary">Supported: .txt, .md</p>
                  <input
                    type="file"
                    accept=".txt,.md"
                    (change)="onFileSelected($event)"
                    class="hidden"
                  >
                </div>
              </label>
              <button
                (click)="clearText()"
                class="px-6 py-3 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition-colors font-medium text-sm"
              >
                🗑️ Clear
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Fixed Right Sidebar -->
      <div class="hidden lg:flex sticky top-[70px] w-[380px] flex-shrink-0 bg-white border-l border-gray-200 shadow-xl flex-col">
        <h3 class="text-lg font-bold text-primary border-b p-6 text-center sticky top-0 bg-white">🎯 Quick Copy</h3>
        
        <div class="p-6 flex-1 overflow-y-auto space-y-2">
          <button
            (click)="copyToClipboard('uppercase')"
            class="w-full text-left px-4 py-3 rounded-lg border border-gray-200 hover:bg-purple-50 hover:border-purple-300 transition-colors text-sm"
            [class.bg-purple-50]="copiedCase() === 'uppercase'"
          >
            <div class="flex items-center justify-between">
              <p class="font-semibold text-gray-700">UPPERCASE</p>
              <mat-icon class="text-purple-700" [title]="copiedCase() === 'uppercase' ? 'Copied!' : 'Copy'">content_copy</mat-icon>
            </div>
            <p class="text-xs text-gray-700 truncate mt-1">{{ results().uppercase || 'Your text will appear here' }}</p>
          </button>

          <button
            (click)="copyToClipboard('lowercase')"
            class="w-full text-left px-4 py-3 rounded-lg border border-gray-200 hover:bg-purple-50 hover:border-purple-300 transition-colors text-sm"
            [class.bg-purple-50]="copiedCase() === 'lowercase'"
          >
            <div class="flex items-center justify-between">
              <p class="font-semibold text-gray-700">lowercase</p>
              <mat-icon class="text-purple-700" [title]="copiedCase() === 'lowercase' ? 'Copied!' : 'Copy'">content_copy</mat-icon>
            </div>
            <p class="text-xs text-gray-700 truncate mt-1">{{ results().lowercase || 'Your text will appear here' }}</p>
          </button>

          <button
            (click)="copyToClipboard('titlecase')"
            class="w-full text-left px-4 py-3 rounded-lg border border-gray-200 hover:bg-purple-50 hover:border-purple-300 transition-colors text-sm"
            [class.bg-purple-50]="copiedCase() === 'titlecase'"
          >
            <div class="flex items-center justify-between">
              <p class="font-semibold text-gray-700">Title Case</p>
              <mat-icon class="text-purple-700" [title]="copiedCase() === 'titlecase' ? 'Copied!' : 'Copy'">content_copy</mat-icon>
            </div>
            <p class="text-xs text-gray-700 truncate mt-1">{{ results().titlecase || 'Your text will appear here' }}</p>
          </button>

          <button
            (click)="copyToClipboard('sentencecase')"
            class="w-full text-left px-4 py-3 rounded-lg border border-gray-200 hover:bg-purple-50 hover:border-purple-300 transition-colors text-sm"
            [class.bg-purple-50]="copiedCase() === 'sentencecase'"
          >
            <div class="flex items-center justify-between">
              <p class="font-semibold text-gray-700">Sentence case</p>
              <mat-icon class="text-purple-700" [title]="copiedCase() === 'sentencecase' ? 'Copied!' : 'Copy'">content_copy</mat-icon>
            </div>
            <p class="text-xs text-gray-700 truncate mt-1">{{ results().sentencecase || 'Your text will appear here' }}</p>
          </button>

          <button
            (click)="copyToClipboard('camelcase')"
            class="w-full text-left px-4 py-3 rounded-lg border border-gray-200 hover:bg-purple-50 hover:border-purple-300 transition-colors text-sm"
            [class.bg-purple-50]="copiedCase() === 'camelcase'"
          >
            <div class="flex items-center justify-between">
              <p class="font-semibold text-gray-700">camelCase</p>
              <mat-icon class="text-purple-700" [title]="copiedCase() === 'camelcase' ? 'Copied!' : 'Copy'">content_copy</mat-icon>
            </div>
            <p class="text-xs text-gray-700 truncate mt-1">{{ results().camelcase || 'Your text will appear here' }}</p>
          </button>

          <button
            (click)="copyToClipboard('pascalcase')"
            class="w-full text-left px-4 py-3 rounded-lg border border-gray-200 hover:bg-purple-50 hover:border-purple-300 transition-colors text-sm"
            [class.bg-purple-50]="copiedCase() === 'pascalcase'"
          >
            <div class="flex items-center justify-between">
              <p class="font-semibold text-gray-700">PascalCase</p>
              <mat-icon class="text-purple-700" [title]="copiedCase() === 'pascalcase' ? 'Copied!' : 'Copy'">content_copy</mat-icon>
            </div>
            <p class="text-xs text-gray-700 truncate mt-1">{{ results().pascalcase || 'Your text will appear here' }}</p>
          </button>

          <button
            (click)="copyToClipboard('snakecase')"
            class="w-full text-left px-4 py-3 rounded-lg border border-gray-200 hover:bg-purple-50 hover:border-purple-300 transition-colors text-sm"
            [class.bg-purple-50]="copiedCase() === 'snakecase'"
          >
            <div class="flex items-center justify-between">
              <p class="font-semibold text-gray-700">snake_case</p>
              <mat-icon class="text-purple-700" [title]="copiedCase() === 'snakecase' ? 'Copied!' : 'Copy'">content_copy</mat-icon>
            </div>
            <p class="text-xs text-gray-700 truncate mt-1">{{ results().snakecase || 'Your text will appear here' }}</p>
          </button>

          <button
            (click)="copyToClipboard('kebabcase')"
            class="w-full text-left px-4 py-3 rounded-lg border border-gray-200 hover:bg-purple-50 hover:border-purple-300 transition-colors text-sm"
            [class.bg-purple-50]="copiedCase() === 'kebabcase'"
          >
            <div class="flex items-center justify-between">
              <p class="font-semibold text-gray-700">kebab-case</p>
              <mat-icon class="text-purple-700" [title]="copiedCase() === 'kebabcase' ? 'Copied!' : 'Copy'">content_copy</mat-icon>
            </div>
            <p class="text-xs text-gray-700 truncate mt-1">{{ results().kebabcase || 'Your text will appear here' }}</p>
          </button>

          <button
            (click)="copyToClipboard('dotcase')"
            class="w-full text-left px-4 py-3 rounded-lg border border-gray-200 hover:bg-purple-50 hover:border-purple-300 transition-colors text-sm"
            [class.bg-purple-50]="copiedCase() === 'dotcase'"
          >
            <div class="flex items-center justify-between">
              <p class="font-semibold text-gray-700">dot.case</p>
              <mat-icon class="text-purple-700" [title]="copiedCase() === 'dotcase' ? 'Copied!' : 'Copy'">content_copy</mat-icon>
            </div>
            <p class="text-xs text-gray-700 truncate mt-1">{{ results().dotcase || 'Your text will appear here' }}</p>
          </button>
        </div>

        <!-- Info Box -->
        <div class="border-t border-gray-200 px-6 py-4">
          <p class="text-xs text-secondary leading-relaxed">
            <strong>💡 Tip:</strong> Paste your text and click on any case format to copy it instantly to your clipboard.
          </p>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Resource Content Section -->

<app-related-tools [currentRoute]="'/categories/text/case-converter'" [maxTools]="6"></app-related-tools>

<app-tool-resource-content [data]="resourceContent"></app-tool-resource-content>
