<section class="section trending-tools">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">🔥 Trending Tools</h2>
      <p class="section-subtitle">Most popular tools used by our community</p>
    </div>

    <div class="tools-grid">
      @for (tool of tools; track tool.name) {
        <a [routerLink]="tool.route" class="tool-card">
          <div class="tool-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="tool.icon" />
            </svg>
          </div>
          
          <div class="tool-content">
            <div class="tool-header">
              <h3 class="tool-name">{{ tool.name }}</h3>
              <span class="category-badge">{{ tool.category }}</span>
            </div>
            <p class="tool-description">{{ tool.description }}</p>
            <div class="tool-footer">
              <span class="usage-count">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                </svg>
                {{ tool.usageCount }} uses
              </span>
            </div>
          </div>
        </a>
      }
    </div>
  </div>
</section>
